<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的待办清单</title>
    <style>
        body{font-family:微软雅黑;max-width:500px;margin:30px auto;padding:0 20px;}
        h1{text-align:center;color:#333;}
        .input-box{display:flex;gap:8px;margin-bottom:20px;}
        input{flex:1;padding:10px;font-size:16px;}
        button{padding:10px 16px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;}
        li{padding:8px 0;font-size:17px;display:flex;justify-content:space-between;border-bottom:1px solid #eee;}
        .delBtn{background-color:red;padding:4px 8px;font-size:14px;}
    </style>
</head>
<body>
    <h1>待办清单</h1>
    <div class="input-box">
        <input id="todoInput" placeholder="输入待办事项">
        <button onclick="addTodo()">添加</button>
    </div>
    <ul id="todoList"></ul>

    <script>
        function addTodo(){
            let val = document.getElementById('todoInput').value.trim();
            if(!val)return;
            let li = document.createElement('li');
            li.innerText = val;
            // 删除按钮
            let delBtn = document.createElement("button");
            delBtn.innerText = "删除";
            delBtn.className = "delBtn";
            delBtn.onclick = function(){
                li.remove();
            }
            li.appendChild(delBtn);
            document.getElementById('todoList').appendChild(li);
            document.getElementById('todoInput').value = "";
        }
    </script>
</body>
</html>
